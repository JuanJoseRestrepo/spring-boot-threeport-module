# Verification for the module.
#
# Two jobs. The first is fast and covers the Go code; the second builds the
# sample image, which takes minutes because Maven compiles petclinic from
# source, so it runs alongside rather than holding up the first.

name: Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # every branch, not just main. A pull_request event fires in the repository
  # the PR targets, so work pushed to a fork gets no verification until the PR
  # is opened - and none at all while that repository has Actions disabled.
  push:

permissions:
  contents: read

# a branch with a PR open matches both triggers above. Rather than drop one and
# lose coverage in the fork, superseded runs are cancelled: the useful run is
# the one for the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.27'
        cache: false

    - name: Cache Go build + module cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "these files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    # magefiles is excluded throughout: the SDK generates it as package main
    # with no main function, so `go build ./...` fails on it while mage itself
    # runs it fine. Excluding it here rather than editing the file, which
    # 'threeport-sdk gen' would overwrite on the next run.
    - name: Build
      run: go build $(go list ./... | grep -v magefiles)

    - name: Vet
      run: go vet $(go list ./... | grep -v magefiles)

    - name: Unit tests
      run: go test -race $(go list ./... | grep -v magefiles)

    # the SDK is pinned to the version the module depends on, so a change to
    # that dependency and a change to the generated code cannot disagree
    - name: Install threeport-sdk
      run: |
        version=$(go list -m -f '{{.Version}}' github.com/threeport/threeport)
        go install github.com/threeport/threeport/cmd/sdk@"$version"
        mv "$(go env GOPATH)/bin/sdk" "$(go env GOPATH)/bin/threeport-sdk"

    - name: Regenerate
      run: $(go env GOPATH)/bin/threeport-sdk gen -c sdk-config.yaml

    # catches a generated file edited by hand, and an sdk-config.yaml change
    # committed without the code it produces
    - name: Verify generation is idempotent
      run: git diff --exit-code

  sample-image:
    name: Sample Image
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    # the image is a patch applied over a pinned upstream petclinic: a POM
    # insertion, a replaced profile and two migrations. Building it is what
    # proves the patch still applies and that Flyway is still wired in - a
    # failure to wire it is silent at runtime, the application starting and
    # serving against a database with no tables.
    - name: Build the sample image
      run: docker build -t spring-petclinic:ci examples/spring-petclinic

    # the starter rather than flyway-core: Spring Boot 4 moved each
    # autoconfiguration into its own module, so flyway-core alone puts Flyway
    # on the classpath with nothing to start it. That failure is silent - the
    # application builds, starts, and serves against a database with no tables
    - name: Verify Flyway reached the image
      run: |
        docker create --name ci-check spring-petclinic:ci
        docker cp ci-check:/home/petclinic/app.jar /tmp/app.jar
        docker rm ci-check

        for entry in \
          BOOT-INF/lib/spring-boot-flyway \
          BOOT-INF/classes/db/migration/postgres/V1__schema.sql \
          BOOT-INF/classes/db/migration/postgres/V2__seed_data.sql
        do
          unzip -l /tmp/app.jar | grep -q "$entry" \
            || { echo "missing from the image: $entry"; exit 1; }
        done

        unzip -p /tmp/app.jar BOOT-INF/classes/application-postgres.properties \
          | grep -q '^spring.flyway.enabled=true' \
          || { echo "the postgres profile does not enable Flyway"; exit 1; }
