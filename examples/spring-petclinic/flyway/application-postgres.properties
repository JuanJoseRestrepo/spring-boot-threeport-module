# Replaces petclinic's own postgres profile.
#
# Upstream sets spring.sql.init.mode=always, which has every replica run
# schema.sql on startup. The script is idempotent but not concurrency-safe:
# PostgreSQL's CREATE INDEX IF NOT EXISTS checks the catalog and then creates,
# so two replicas starting together both pass the check and the second fails
# with "duplicate key value violates unique constraint pg_class_relname_nsp_index".
#
# Flyway takes a database lock for the duration of a migration, so any number
# of replicas can start at once: one applies the migrations and the rest wait
# and then find them already applied.
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
spring.datasource.username=${POSTGRES_USER:petclinic}
spring.datasource.password=${POSTGRES_PASS:petclinic}

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgres
